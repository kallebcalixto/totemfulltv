<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>KBS TV - Master Control</title>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        
        .admin-layer { position: absolute; overflow: hidden; display: block; }

        /* Ajuste do Iframe do Player */
        .video-iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* Ajuste da Grade */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(4, 1fr); 
            gap: 1px; 
            background: #000;
            width: 100%;
            height: 100%;
        }
        .quadrado { 
            background: #050505; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        img { width: 100%; height: 100%; object-fit: fill; display: block; }
    </style>
</head>
<body>

    <!-- Player via Iframe do Servidor (Igual ao Assemco para rodar liso no Windows e Manjaro) -->
    <div id="v-layer" class="admin-layer">
        <iframe class="video-iframe" src="https://live.kbstvpro.com.br/player.html" allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>
    <div id="vb-layer" class="admin-layer">
        <video id="vid2" playsinline muted autoplay></video>
    </div>
    
    <div id="g-layer" class="admin-layer">
        <div class="grid" id="gradePrincipal"></div>
    </div>

<script>
    const mkt = firebase.initializeApp({
        apiKey: "AIzaSyBh-dhSMEgVO0dPyPdE-JAtPb2LeKaq9og",
        databaseURL: "https://marketing-19f3d-default-rtdb.firebaseio.com"
    }, "mktApp").database();

    const lay = firebase.initializeApp({ 
        databaseURL: "https://totem-full-tv-default-rtdb.firebaseio.com" 
    }, "layApp").database();

    // Lógica da Playlist MP4 no Player 2
    const p2 = document.getElementById('vid2');
    let playlistMp4 = [];
    let indiceMp4Atual = 0;

    lay.ref('layout_totem/playlist_mp4').on('value', snap => {
        playlistMp4 = [];
        const data = snap.val();
        if (data) {
            Object.keys(data).forEach(key => { playlistMp4.push(data[key].url); });
        }
        if (playlistMp4.length > 0 && p2.paused) {
            indiceMp4Atual = 0;
            p2.src = playlistMp4[indiceMp4Atual];
            p2.play();
        }
    });

    p2.onended = () => {
        if (playlistMp4.length > 0) {
            indiceMp4Atual = (indiceMp4Atual + 1) % playlistMp4.length;
            p2.src = playlistMp4[indiceMp4Atual];
            p2.play();
        }
    };

    // Lógica da Grade
    let anuncios = [];
    let slideIdx = Array(17).fill(0);
    const grade = document.getElementById('gradePrincipal');
    for(let i=1; i<=16; i++) { grade.innerHTML += `<div class="quadrado" id="q${i}"></div>`; }

    mkt.ref('anuncios').on('value', snap => {
        anuncios = []; 
        snap.forEach(c => { anuncios.push(c.val()); });
        atualizar(); 
    });

    function atualizar() {
        const h = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', hour12: false, timeZone: 'America/Sao_Paulo'});
        const d = new Date().getDay();
        for(let i=1; i<=16; i++) {
            const box = document.getElementById(`q${i}`);
            const ativos = anuncios.filter(a => parseInt(a.pos) === i && a.days.includes(d) && (h >= a.start && h <= a.end));
            if (ativos.length > 0) {
                box.innerHTML = `<img src="${ativos[slideIdx[i] % ativos.length].url}">`;
            } else { box.innerHTML = ""; }
        }
    }
    setInterval(atualizar, 1000);
    setInterval(() => { for(let i=1; i<=16; i++) slideIdx[i]++; atualizar(); }, 15000);

    // Sincronia de Layout
    lay.ref('layout_totem').on('value', snap => {
        const s = snap.val(); if(!s) return;
        const mover = (id, d) => {
            const el = document.getElementById(id);
            if(!d || !el) return;
            el.style.left = d.x + "%"; el.style.top = d.y + "%";
            el.style.width = d.w + "%"; el.style.height = d.h + "%";
            el.style.transform = `rotate(${d.r || 0}deg)`;
        };
        mover('v-layer', s.video);
        mover('g-layer', s.grade);
        mover('vb-layer', s.vidBanner);
    });
</script>
</body>
</html>
