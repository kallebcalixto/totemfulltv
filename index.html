<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KBS TV PRO - Smart TV & Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --netflix-red: #e50914;
            --netflix-black: #101014;
            --card-bg: #1f1f24;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--netflix-black);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        ::-webkit-scrollbar { height: 4px; width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* ================= HEADER ================= */
        header {
            height: 50px;
            background: rgba(16, 16, 20, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .brand-logo {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .brand-logo span {
            color: var(--netflix-red);
        }

        .live-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--netflix-red);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--netflix-red);
            animation: pulse 1.5s infinite;
        }

        .dot.loading {
            background: #ffc107;
            box-shadow: 0 0 6px #ffc107;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* ================= ÁREA DO PLAYER ================= */
        #main-content {
            flex: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            outline: none;
        }

        .player-info-overlay {
            position: absolute;
            bottom: 20px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--netflix-red);
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .player-channel-name {
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
        }

        .player-channel-group {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ================= ROLETA HORIZONTAL (OCULTÁVEL) ================= */
        #roleta-section {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 130px;
            background: rgba(20, 20, 24, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 15px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease;
        }

        /* Estado Oculto da barra */
        body.hide-ui header,
        body.hide-ui #roleta-section,
        body.hide-ui .player-info-overlay {
            opacity: 0;
            pointer-events: none;
        }
        body.hide-ui #roleta-section {
            transform: translateY(100%);
        }

        .roleta-titulo {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .roleta-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 6px;
            scroll-behavior: smooth;
            outline: none;
            -webkit-overflow-scrolling: touch;
        }

        .roleta-card {
            flex: 0 0 110px;
            height: 70px;
            background: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            scroll-snap-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .roleta-card img {
            max-width: 65%;
            max-height: 42px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .roleta-card.active, .roleta-card:focus {
            border-color: var(--netflix-red);
            background: #222228;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            outline: none;
        }

        .roleta-card-name {
            font-size: 0.55rem;
            font-weight: 700;
            color: #ccc;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        @media (min-width: 768px) {
            header { height: 60px; }
            #roleta-section { height: 150px; padding: 0 20px; }
            .roleta-card { flex: 0 0 130px; height: 80px; }
            .roleta-card img { max-height: 50px; }
            .roleta-card-name { font-size: 0.6rem; }
        }
    </style>
</head>

        </div>
        <div id="player-container">
            <video id="video" autoplay playsinline webkit-playsinline></video>
        </div>
    </div>

    <div id="roleta-section">
        <div class="roleta-titulo">Canais Disponíveis</div>
        <div id="roleta-container" class="roleta-container" tabindex="0"></div>

    <script>
        const video = document.getElementById('video');
        const roletaContainer = document.getElementById('roleta-container');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const playerChannelName = document.getElementById('player-channel-name');
        const playerChannelGroup = document.getElementById('player-channel-group');

        let hls;
        let currentUrl = "";
        let lastTime = 0;
        let stallCount = 0;
        let currentIndex = 0;
        let uiTimeout = null;

        function showUI() {
            document.body.classList.remove('hide-ui');
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => {
                document.body.classList.add('hide-ui');
            }, 8000); // 8 segundos inativo no mobile/tv
        }

        window.addEventListener('mousemove', showUI);
        window.addEventListener('touchstart', showUI);
        window.addEventListener('keydown', showUI);
        window.addEventListener('click', showUI);

        function iniciarAudioPlayer() {
            video.muted = false;
            video.play().catch(() => {});
            window.removeEventListener('click', iniciarAudioPlayer);
            window.removeEventListener('touchstart', iniciarAudioPlayer);
        }

        window.addEventListener('click', iniciarAudioPlayer, { once: true });
        window.addEventListener('touchstart', iniciarAudioPlayer, { once: true });

        function startAntiStall() {
            setInterval(() => {
                if (currentUrl && !video.paused) {
                    if (video.currentTime === lastTime) {
                        stallCount++;
                        statusText.innerText = `RECONECTANDO (${5 - stallCount}s)`;
                        statusDot.className = "dot loading";
                        if (stallCount >= 5) {
                            tocar(canaisArray[currentIndex]);
                            stallCount = 0;
                        }
                    } else {
                        stallCount = 0;
                        statusText.innerText = "AO VIVO";
                        statusDot.className = "dot";
                        lastTime = video.currentTime;
                    }
                }
            }, 1000);
        }

        function tocar(canalObj, elemento, index) {
            document.querySelectorAll('.roleta-card').forEach(el => el.classList.remove('active'));
            if(elemento) {
                elemento.classList.add('active');
                elemento.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                if (index !== undefined) currentIndex = index;
            }

            currentUrl = canalObj.url;
            playerChannelName.innerText = canalObj.nome.toUpperCase();
            playerChannelGroup.innerText = canalObj.grupo;

            if (hls) hls.destroy();
            
            if (Hls.isSupported()) {
                hls = new Hls({
                    manifestLoadingMaxRetry: 10,
                    levelLoadingMaxRetry: 10
                });
                hls.loadSource(canalObj.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                    video.play().catch(() => {}); 
                    statusText.innerText = "AO VIVO";
                });
                hls.on(Hls.Events.ERROR, (event, data) => { 
                    if(data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = canalObj.url;
                video.play().catch(() => {});
            }

            showUI();
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const canais = [];
            let atual = null;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nome = line.split(',')[1] || "Canal Desconhecido";
                    const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    let grupo = line.match(/group-title="([^"]+)"/)?.[1] || "Geral";
                    
                    grupo = grupo.replace("CANAIS | ", "").replace("Canais | ", "");
                    atual = { nome, logo, grupo };
                } else if (line.startsWith('http')) {
                    if (atual) {
                        atual.url = line;
                        canais.push(atual);
                        atual = null;
                    }
                }
            });
            return canais;
        }

                tocar(canais[currentIndex], cardsElements[currentIndex], currentIndex);
            } 
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + canais.length) % canais.length;
                tocar(canais[currentIndex], cardsElements[currentIndex], currentIndex);
            }
            else if (e.key === 'Enter') {
                e.preventDefault();
                tocar(canais[currentIndex], cardsElements[currentIndex], currentIndex);
            }
        });

        startAntiStall();
    </script>
</body>
